<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Entry Page</title>

<body>

<div class="container">
  <!-- Top Section -->
  <div class="top">
    <div class="top1">
      <div class="topserch">
        <input type="text" class="inputtop" placeholder="ItemCode" id="itemcode" />
        <input type="text" class="inputtop" placeholder="Customer" id="customer" />
        <button class="search-btn" id="searchCustomerBtn">
            <i class="fas fa-search"></i> Search
          </button>
      </div>
      <input type="text" class="inputtop" placeholder="Item Name" id="itemName" />
    </div>
    <div class="top1">
      <select class="inputtop1" id="category">
        <option value="">All Categories</option>
        {% for row in value %}
          <option value="{{ row[0] }}">{{ row[0] }}</option>
        {% endfor %}
      </select>
      <button class="input" id="itemSelectBtn">Item Select</button>
      <button class="input" id="loadBtn">Load</button>
    </div>
  </div>

  <!-- Filter Buttons -->
  <div class="filter-buttons">
    <button class="btn-secondary">Send Food Cost Category</button>
    <button class="btn-secondary">Customer Category</button>
    <button class="btn-secondary">Show Promotions</button>
    <button class="btn-secondary">Discount and Delivery</button>
    <button class="btn-secondary">Send Food Cost Category</button>
    <button class="btn-secondary">Customer Category</button>
    <button class="btn-secondary">Show Promotions</button>
    <button class="btn-secondary">Discount and Delivery</button>
    <button class="btn-secondary">Send Food Cost Category</button>
    <button class="btn-secondary">Customer Category</button>
    <button class="btn-secondary">Show Promotions</button>
    <button class="btn-secondary">Discount and Delivery</button>
    <button class="btn-secondary">Send Food Cost Category</button>
    <button class="btn-secondary">Customer Category</button>
  </div>

  <!-- Table Section -->
  <div class="tableDiv">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>ITEMCODE</th>
          <th>ITEMNAME</th>
          <th>SUPPLIERNAME</th>
          <th>RETAILPRICE</th>
          <th>WHOLESALEPRICE</th>
          <th>CATEGORYNAME</th>
          <th>BARCODE</th>
          <th>CURRENT STOCK</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dynamic rows will be injected here -->
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div>Selected Items: 1</div>
    <div>Total Qty: 20</div>
    <div>Invoice No: #123456</div>
  </div>
</div>

<script>
  let multiSelectMode = false;
  let selectedRows = [];

  function fetchAndUpdateTable() {
  const itemCode = document.getElementById("itemcode").value.trim();
  const itemName = document.getElementById("itemName").value.trim();
  const category = document.getElementById("category").value;

  console.log("Fetching items with:", { itemCode, itemName, category });

  fetch(`/search_items?itemcode=${itemCode}&itemname=${itemName}&category=${category}`)
    .then((response) => {
      if (!response.ok) {
        throw new Error("Network response was not ok");
      }
      return response.json();
    })
    .then((data) => {
      console.log("Data received:", data);
      const tbody = document.querySelector("tbody");
      tbody.innerHTML = ""; // Clear previous results

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No items found</td></tr>`;
        return;
      }

      data.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.itemcode || ""}</td>
          <td>${item.itemname || ""}</td>
          <td>${item.suppliername || ""}</td>
          <td>${item.retailprice || ""}</td>
          <td>${item.wholesaleprice || ""}</td>
          <td>${item.categoryname || ""}</td>
          <td>${item.barcode || ""}</td>
          <td>${item.currentStock || ""}</td>
        `;
        tbody.appendChild(row);
      });
    })
    .catch((error) => {
      console.error("Fetch error:", error);
    });
}


  function getStoredItems() {
    const stored = sessionStorage.getItem("selectedItems");
    return stored ? JSON.parse(stored) : [];
  }

  // function saveStoredItems(items) {
  //   sessionStorage.setItem("selectedItems", JSON.stringify(items));
  // }

  // function mergeSelectedItems(newItems) {
  //   const existing = getStoredItems();
  //   newItems.forEach(newItem => {
  //     const exists = existing.some(
  //       old => old.itemCode === newItem.itemCode && old.itemName === newItem.itemName
  //     );
  //     if (!exists) {
  //       existing.push(newItem);
  //     }
  //   });
  //   saveStoredItems(existing);
  // }

  // Function to fetch purchased items by customer
  
  document.addEventListener("DOMContentLoaded", function () {
    
    // Load the selected customer from session storage
    const selectedCustomer = sessionStorage.getItem("selectedCustomer");
    if (selectedCustomer) {
        const customer = JSON.parse(selectedCustomer);
        document.getElementById('customer').value = customer.CUST_NAME; // Set customer name
    }

   
});

     // 👇 Load initial items
    fetchAndUpdateTable();
    ["itemcode", "customer", "itemName", "category"].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener(id === "category" ? "change" : "input", fetchAndUpdateTable);
      }
    });

    const table = document.querySelector(".tableDiv table");
    const itemSelectBtn = document.getElementById("itemSelectBtn");
    const loadBtn = document.getElementById("loadBtn");

    itemSelectBtn.addEventListener("click", () => {
      multiSelectMode = true;
      selectedRows = [];
      document.querySelectorAll("tbody tr").forEach(row => row.classList.remove("selected"));
      alert("Multi-select mode enabled. Click multiple rows to select. Press 'Load' to proceed.");
    });

    table.addEventListener("click", (e) => {
  const row = e.target.closest("tr");
  if (!row || row.querySelector("th")) return;

  const cells = row.querySelectorAll("td");
  const rowData = {
    itemcode: cells[1]?.innerText || "", // ITEMCODE
    itemname: cells[2]?.innerText || "", // ITEMNAME
    suppliername: cells[3]?.innerText || "", // SUPPLIERNAME
    barcode: cells[7]?.innerText || "", // BARCODE
    locationname: cells[8]?.innerText || "", // Assuming you want to fetch location name from another source
    unit: cells[5]?.innerText || "", // WHOLESALEPRICE (if this is meant to be the unit, adjust accordingly)
    qty: 0, // Default quantity
    retailprice: parseFloat(cells[4]?.innerText) || 0.0, // RETAILPRICE
    discount: "", // Set based on your logic
    amount: "" // Assuming Amount is in another column, adjust as needed
};




  if (multiSelectMode) {
    row.classList.toggle("selected");

    const exists = selectedRows.some(r => r.itemcode === rowData.itemcode && r.itemname === rowData.itemname);


    if (!exists) {
      selectedRows.push(rowData);
    } else {
      selectedRows = selectedRows.filter(r => !(r.itemcode === rowData.itemcode && r.itemname === rowData.itemname));

    }
  } else {
  // Single select mode: fetch existing and add this one
  const existing = JSON.parse(sessionStorage.getItem("selectedItems") || "[]");

  const exists = existing.some(r => r.itemcode === rowData.itemcode && r.itemname === rowData.itemname);

  if (!exists) existing.push(rowData);

  sessionStorage.setItem("selectedItems", JSON.stringify(existing));
  window.location.replace("/");
}

});

loadBtn.addEventListener("click", () => {
  if (!multiSelectMode) {
    alert("Please click 'Item Select' first to enable multi-selection.");
    return;
  }

  if (selectedRows.length === 0) {
    alert("No rows selected.");
    return;
  }

  // ✅ Merge with existing sessionStorage
  const existing = JSON.parse(sessionStorage.getItem("selectedItems") || "[]");

  selectedRows.forEach(item => {
    const exists = existing.some(
      r => r.itemcode === item.itemcode && r.itemname === item.itemname
    );
    if (!exists) existing.push(item);
  });

  sessionStorage.setItem("selectedItems", JSON.stringify(existing));
  multiSelectMode = false;
  window.location.replace("/"); // ✅ Go back to index
});




document.getElementById("searchCustomerBtn").addEventListener("click", function() {
  const customerName = document.getElementById("customer").value.trim(); // Get the customer name from the input

  if (!customerName) {
    alert("Please enter a customer name."); // Alert if no customer name is provided
    return;
  }

  // Clear the table before fetching new data
  const tbody = document.querySelector("tbody");
  tbody.innerHTML = ""; // Clear previous results

  // Fetch the customer code based on the customer name
  fetch(`/api/customer_code?customer_name=${encodeURIComponent(customerName)}`)
    .then(response => {
      if (!response.ok) {
        return response.json().then(err => { throw new Error(err.error || "Unknown error"); });
      }
      return response.json();
    })
    .then(data => {
      const customerCode = data.customer_code; // Get the customer code from the response

      // Now fetch purchased items for the specified customer code
      return fetch(`/api/purchased_items?customer_code=${encodeURIComponent(customerCode)}`);
    })
    .then(response => {
      if (!response.ok) {
        return response.json().then(err => { throw new Error(err.error || "Unknown error"); });
      }
      return response.json();
    })
    .then(data => {
      console.log("Data received:", data); // Log the data to see its structure
      if (!Array.isArray(data)) {
        throw new Error("Expected an array but received: " + JSON.stringify(data));
      }

      // Clear the table before displaying new results
      tbody.innerHTML = ""; // Clear previous results

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9">No purchased items found for this customer.</td></tr>`; // Show message if no items found
        return;
      }

      // Populate the table with the purchased items
      data.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${item.itemCode || ""}</td>
          <td>${item.itemName || ""}</td>
          <td>${item.suppliername || ""}</td>
          <td>${item.retail || ""}</td>
          <td>${item.wholesale || ""}</td>
          <td>${item.categoryname || ""}</td>
          <td>${item.barcode || ""}</td>
          <td>${item.currentStock || ""}</td>
        `;
        tbody.appendChild(row); // Append the new row to the table body
      });
    })
    .catch(error => {
      console.error("Fetch error:", error); // Log any errors
      alert(error.message); // Alert the user if there was an error
    });
});
document.addEventListener("DOMContentLoaded", function () {
  const table = document.querySelector(".tableDiv table");
  let selectedRowIndex = -1; // To keep track of the currently selected row

  // Function to highlight the selected row
  function highlightRow(index) {
    const rows = table.querySelectorAll("tbody tr");
    rows.forEach((row, i) => {
      if (i === index) {
        row.classList.add("selected");
      } else {
        row.classList.remove("selected");
      }
    });
  }

  // Event listener for keydown events
  document.addEventListener("keydown", function (event) {
    const rows = table.querySelectorAll("tbody tr");
    if (rows.length === 0) return; // No rows to navigate

    if (event.key === "ArrowDown") {
      // Move down
      selectedRowIndex = (selectedRowIndex + 1) % rows.length; // Wrap around
      highlightRow(selectedRowIndex);
      event.preventDefault(); // Prevent default scrolling behavior
    } else if (event.key === "ArrowUp") {
      // Move up
      selectedRowIndex = (selectedRowIndex - 1 + rows.length) % rows.length; // Wrap around
      highlightRow(selectedRowIndex);
      event.preventDefault(); // Prevent default scrolling behavior
    } else if (event.key === "Enter") {
      // Load the selected item
      if (selectedRowIndex >= 0) {
        const selectedRow = rows[selectedRowIndex];
        const cells = selectedRow.querySelectorAll("td");
        const rowData = {
          itemcode: cells[1]?.innerText || "",
          itemname: cells[2]?.innerText || "",
          suppliername: cells[3]?.innerText || "",
          barcode: cells[7]?.innerText || "",
          retailprice: parseFloat(cells[4]?.innerText) || 0.0,
          // Add any other necessary fields here
        };

        // Store the selected item in sessionStorage or handle it as needed
        const existing = JSON.parse(sessionStorage.getItem("selectedItems") || "[]");
        const exists = existing.some(r => r.itemcode === rowData.itemcode && r.itemname === rowData.itemname);
        if (!exists) existing.push(rowData);
        sessionStorage.setItem("selectedItems", JSON.stringify(existing));

        // Redirect or load the index page
        window.location.replace("/"); // Adjust the URL as needed
      }
    }
  });
});





  
</script>
